default_doi_resolver: 'oadoi.org'

# Hostnames plugin: prioriza fontes de referência (sobe no ranking quando
# aparecem nos resultados; não injeta nada) e rebaixa sites de baixo valor.
# Curadoria por área — notícias, tecnologia e ciência, BR e internacional.
# Evitados sites de paywall duro (nytimes, wsj): o scraper do MCP não passa
# e a vaga do dossiê seria desperdiçada.
hostnames:
  high_priority:
    # Notícias BR
    - '(.*\.)?globo\.com$'          # g1, O Globo, Valor
    - '(.*\.)?uol\.com\.br$'        # UOL, Folha
    - '(.*\.)?estadao\.com\.br$'
    - '(.*\.)?cnnbrasil\.com\.br$'
    - '(.*\.)?ebc\.com\.br$'        # Agência Brasil
    - '(.*\.)?poder360\.com\.br$'
    # Notícias internacionais (abertas ao scraping)
    - '(.*\.)?bbc\.com$'
    - '(.*\.)?reuters\.com$'
    - '(.*\.)?apnews\.com$'
    - '(.*\.)?theguardian\.com$'
    - '(.*\.)?dw\.com$'
    # Tecnologia BR
    - '(.*\.)?tecnoblog\.net$'
    - '(.*\.)?tecmundo\.com\.br$'
    - '(.*\.)?canaltech\.com\.br$'
    - '(.*\.)?techtudo\.com\.br$'
    # Tecnologia internacional
    - '(.*\.)?theverge\.com$'
    - '(.*\.)?techcrunch\.com$'
    - '(.*\.)?arstechnica\.com$'
    # Referência dev
    - '(.*\.)?developer\.mozilla\.org$'
    - '(.*\.)?stackoverflow\.com$'
    - '(.*\.)?github\.com$'
    - '(.*\.)?wikipedia\.org$'
    # Games BR
    - '(.*\.)?adrenaline\.com\.br$'
    - '(.*\.)?voxel\.com\.br$'
    - '(.*\.)?theenemy\.com\.br$'
    # Games internacional
    - '(.*\.)?ign\.com$'            # inclui br.ign.com
    - '(.*\.)?gamespot\.com$'
    - '(.*\.)?polygon\.com$'
    - '(.*\.)?pcgamer\.com$'
    - '(.*\.)?eurogamer\.net$'
    - '(.*\.)?rockpapershotgun\.com$'
    - '(.*\.)?steampowered\.com$'   # ficha oficial de jogos
    # Guias/wikis de jogos (builds, itens, decisões, walkthroughs)
    - '(.*\.)?fextralife\.com$'     # wikis de RPG (BG3, Elden Ring, souls...)
    - '(.*\.)?fandom\.com$'         # wikis por jogo (quase todo jogo grande)
    - '(.*\.)?wiki\.gg$'            # rede de wikis oficiais (Terraria etc.)
    - '(.*\.)?bg3\.wiki$'           # wiki comunitária de Baldur's Gate 3
    - '(.*\.)?game8\.co$'           # guias detalhados por jogo
    - '(.*\.)?gamerguides\.com$'    # walkthroughs completos
    - '(.*\.)?powerpyx\.com$'       # coletáveis, troféus, 100%
    - '(.*\.)?gamepressure\.com$'   # guias e mapas
    - '(.*\.)?wowhead\.com$'        # WoW/Blizzard: itens e builds
    # IA / modelos LLM (novidades, fichas de modelo, benchmarks)
    - '(.*\.)?huggingface\.co$'     # model cards, papers, releases
    - '(.*\.)?arxiv\.org$'
    - '(.*\.)?openai\.com$'
    - '(.*\.)?anthropic\.com$'
    - '(.*\.)?deepmind\.google$'
    - '(.*\.)?mistral\.ai$'
    - '(.*\.)?ollama\.com$'         # fichas de modelos locais
    - '(.*\.)?artificialanalysis\.ai$'  # benchmarks comparativos de LLM
    - '(.*\.)?lmarena\.ai$'         # ranking Chatbot Arena
    - '(.*\.)?simonwillison\.net$'  # cobertura técnica de novos modelos
    - '(.*\.)?venturebeat\.com$'
    # Ciência
    - '(.*\.)?cienciahoje\.org\.br$'
    - '(.*\.)?fapesp\.br$'          # Pesquisa FAPESP, Agência FAPESP
    - '(.*\.)?abril\.com\.br$'      # Superinteressante
    - '(.*\.)?scielo\.br$'
    - '(.*\.)?capes\.gov\.br$'
    - '(.*\.)?nature\.com$'
    - '(.*\.)?sciencedaily\.com$'
    - '(.*\.)?phys\.org$'
  low_priority:
    # Conteúdo raso / spam de tarefa escolar / re-hospedagem de documento
    - '(.*\.)?pinterest\..*$'
    - '(.*\.)?quora\.com$'
    - '(.*\.)?brainly\.com\.br$'
    - '(.*\.)?passeidireto\.com$'
    - '(.*\.)?scribd\.com$'
    - '(.*\.)?slideshare\.net$'
    - '(.*\.)?softonic\.com$'

