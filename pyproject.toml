[project]
name = "web-search-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=2.0",
    "requests>=2.32",
    "trafilatura>=2.1",
    "lxml>=5.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.scripts]
web-search-mcp = "web_search_mcp.server:main"

[dependency-groups]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_search_mcp"]
